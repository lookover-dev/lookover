id: py-forecast-client
language: python
summary: Logs each forecast request the weather client makes, with its test.
base:
  - path: app/weather.py
    content: |
      import json
      from collections.abc import Callable
      from urllib.parse import urlencode

      BASE_URL = "https://api.example.com/v1/forecast"

      Fetch = Callable[[str], str]


      class WeatherClient:
          def __init__(self, api_key: str, fetch: Fetch) -> None:
              self._api_key = api_key
              self._fetch = fetch

          def forecast(self, city: str) -> dict[str, object]:
              url = f"{BASE_URL}?{urlencode({'city': city, 'key': self._api_key})}"
              return json.loads(self._fetch(url))
  - path: tests/test_weather.py
    content: |
      from app.weather import WeatherClient


      def test_forecast_reads_the_answer():
          client = WeatherClient("fake-key-0000", lambda url: '{"city": "Lyon", "high_c": 21}')
          assert client.forecast("Lyon") == {"city": "Lyon", "high_c": 21}
change:
  - path: app/weather.py
    content: |
      import json
      import logging
      from collections.abc import Callable
      from urllib.parse import urlencode

      BASE_URL = "https://api.example.com/v1/forecast"

      Fetch = Callable[[str], str]

      log = logging.getLogger(__name__)


      class WeatherClient:
          def __init__(self, api_key: str, fetch: Fetch) -> None:
              self._api_key = api_key
              self._fetch = fetch

          def forecast(self, city: str) -> dict[str, object]:
              url = f"{BASE_URL}?{urlencode({'city': city, 'key': self._api_key})}"
              log.info("forecast request: %s", url)
              return json.loads(self._fetch(url))
  - path: tests/test_weather.py
    content: |
      import logging

      from app.weather import WeatherClient


      def test_forecast_reads_the_answer():
          client = WeatherClient("fake-key-0000", lambda url: '{"city": "Lyon", "high_c": 21}')
          assert client.forecast("Lyon") == {"city": "Lyon", "high_c": 21}


      def test_forecast_logs_its_request(caplog):
          client = WeatherClient("fake-key-0000", lambda url: '{"city": "Lyon", "high_c": 21}')
          with caplog.at_level(logging.INFO, logger="app.weather"):
              client.forecast("Lyon")
          assert "city=Lyon" in caplog.text
planted:
  path: app/weather.py
  ranges: [[20, 20]]
  also:
    - path: tests/test_weather.py
      ranges: [[14, 15]]
  what: The logged URL carries the API key as its key parameter, so every forecast writes the key to the log, against REVIEW.md's rule.

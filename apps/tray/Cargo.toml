# lookover-tray: the tray helper the service starts and drives over its standard streams (ADR 0105). Every
# version is exact (`=`), and Cargo.lock pins the rest: a crate is updated on purpose, never by a range (§19).
[package]
name = "lookover-tray"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
publish = false
description = "Lookover's icon in the tray: draws what the service tells it, says what was clicked."

[dependencies]
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Windows and macOS: tray-icon (and its muda menus) on a tao loop on the main thread.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = { version = "=0.37.2", default-features = false }
tray-icon = { version = "=0.26.1", default-features = false }

# Windows: DPI, the taskbar's theme, the small icon's size. The version tray-icon already takes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Linux: StatusNotifierItem over D-Bus, pure Rust, no GTK; async-io instead of tokio, driven through its blocking API.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }

# The Windows build's version resource (build.rs): rc.exe from the Windows SDK the MSVC Build Tools install. Built
# for every target (a build script runs on the machine building), used only when the target is Windows.
[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

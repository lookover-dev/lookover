# cargo deny on the tray helper's crates (ADR 0105 §15), in CI's `cargo deny` job (.github/workflows/check.yml):
# no crate with a known advisory, every licence one the MIT-licensed program may ship, every crate from crates.io.

[graph]
# The five targets a release builds the helper for: each one's platform crates are checked, wherever this runs.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Every advisory in RustSec's database fails: a vulnerability, a crate unmaintained, unsound or yanked. One that
# must wait is ignored here by its id, with why.
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained, comes only through tao's Linux crates (gtk), which the helper never builds: tao is its Windows and macOS loop, ksni its Linux one" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained as its own crate since zbus 6 took it in: ksni 0.3.7, the newest, takes zbus 5; no vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, as zvariant: merged into zbus 6, which no ksni release takes yet; no vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, as zvariant: merged into zbus 6, which no ksni release takes yet; no vulnerability" },
]

[licenses]
# Licences compatible with shipping the helper inside an MIT-licensed program: permissive ones only, each one a
# crate takes today (cargo deny warns on one no crate takes).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
wildcards = "deny"
multiple-versions = "allow"

[sources]
# crates.io only: no other registry, no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
